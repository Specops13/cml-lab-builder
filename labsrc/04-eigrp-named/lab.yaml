id: 04-eigrp-named
title: EIGRP Named Mode, Authentication and Stub
blueprint: ["3.2.a"]
domain: "3.0 Infrastructure - Layer 3"
difficulty: 3
summary: Configure EIGRP named mode with MD5 authentication, a stub router and passive loopbacks.
nodes:
  - name: R1
    kind: router
    x: 0
    y: -150
    config: |
      interface Loopback0
       ip address 10.255.0.1 255.255.255.255
      interface %if0%
       description to R2
       ip address 10.0.12.1 255.255.255.0
       no shutdown
      interface %if1%
       description to R3
       ip address 10.0.13.1 255.255.255.0
       no shutdown
  - name: R2
    kind: router
    x: -200
    y: 100
    config: |
      interface Loopback0
       ip address 10.255.0.2 255.255.255.255
      interface %if0%
       description to R1
       ip address 10.0.12.2 255.255.255.0
       no shutdown
      interface %if1%
       description to R3
       ip address 10.0.23.2 255.255.255.0
       no shutdown
  - name: R3
    kind: router
    x: 200
    y: 100
    config: |
      interface Loopback0
       ip address 10.255.0.3 255.255.255.255
      interface %if0%
       description to R1
       ip address 10.0.13.3 255.255.255.0
       no shutdown
      interface %if1%
       description to R2
       ip address 10.0.23.3 255.255.255.0
       no shutdown
links:
  - {a: {node: R1, port: 0}, b: {node: R2, port: 0}}
  - {a: {node: R1, port: 1}, b: {node: R3, port: 0}}
  - {a: {node: R2, port: 1}, b: {node: R3, port: 1}}
task: |
  # Lab 4 - EIGRP named mode

  R1, R2 and R3 form a triangle; addressing is done.

  1. On all routers configure **EIGRP named mode** with virtual-instance name `ENCOR` and
     `address-family ipv4 unicast autonomous-system 100`. Router ID = Loopback0.
  2. Advertise all connected networks (transit links and Loopback0). Loopback0 must be passive.
  3. Authenticate all EIGRP adjacencies with MD5 using key chain `EIGRP-KEYS`, key 1, key-string `ENCOR`
     (configure under `af-interface default`).
  4. Make R3 an EIGRP **stub** advertising connected routes only (`eigrp stub connected`).
  5. R1 must learn R3's loopback 10.255.0.3/32 via EIGRP.

  Verify with `show ip eigrp neighbors`, `show ip protocols`, `show ip route eigrp`.
checks:
  - id: r1-nbrs
    description: R1 has EIGRP neighbors R2 and R3
    device: R1
    command: show ip eigrp neighbors
    match: ['10\.0\.12\.2\s+%if0s%\s', '10\.0\.13\.3\s+%if1s%\s']
    hint: Same AS (100), same K values, matching authentication on both ends.
  - id: r2-nbrs
    description: R2 has EIGRP neighbors R1 and R3
    device: R2
    command: show ip eigrp neighbors
    match: ['10\.0\.12\.1\s+%if0s%\s', '10\.0\.23\.3\s+%if1s%\s']
  - id: r1-named
    description: R1 runs EIGRP named mode ENCOR, AS 100
    device: R1
    command: show running-config | section router eigrp
    match: ['^router eigrp ENCOR', 'address-family ipv4 unicast autonomous-system 100']
    hint: router eigrp ENCOR / address-family ipv4 unicast autonomous-system 100
  - id: r1-auth
    description: R1 authenticates EIGRP with MD5 key chain EIGRP-KEYS
    device: R1
    command: show running-config | section router eigrp
    match: ['authentication mode md5', 'authentication key-chain EIGRP-KEYS']
  - id: r1-passive
    description: R1 Loopback0 is passive in EIGRP
    device: R1
    command: show running-config | section router eigrp
    match: ['af-interface Loopback0\s*\n\s+passive-interface']
    hint: af-interface Loopback0 / passive-interface
  - id: r3-stub
    description: R3 is an EIGRP stub (connected)
    device: R3
    command: show running-config | section router eigrp
    match: ['eigrp stub connected']
  - id: r1-route
    description: R1 learns 10.255.0.3/32 via EIGRP
    device: R1
    command: show ip route eigrp
    match: ['^D\s+10\.255\.0\.3/32 \[90/']
  # ---- config-mode checks (running config via CML API) ----
  - id: r1-cfg-named
    mode: config
    description: R1 uses EIGRP named mode ENCOR / AS 100
    device: R1
    match:
    - ^router eigrp ENCOR
    - ^ address-family ipv4 unicast autonomous-system 100
  - id: r2-cfg-named
    mode: config
    description: R2 uses EIGRP named mode ENCOR / AS 100
    device: R2
    match:
    - ^router eigrp ENCOR
    - ^ address-family ipv4 unicast autonomous-system 100
  - id: r2-cfg-auth
    mode: config
    description: R2 authenticates with key chain EIGRP-KEYS
    device: R2
    match:
    - authentication mode md5
    - authentication key-chain EIGRP-KEYS
    - ^key chain EIGRP-KEYS
  - id: r3-cfg-stub
    mode: config
    description: R3 is stub connected
    device: R3
    match:
    - ^\s+eigrp stub connected
solution_summary: |
  **What was missing:** EIGRP named mode, authentication, passive loopbacks and the stub setting were not configured.

  **Fix: on R1, R2 and R3** (only the network statements and router-id differ)
  ```
  key chain EIGRP-KEYS
   key 1
    key-string ENCOR
  router eigrp ENCOR
   address-family ipv4 unicast autonomous-system 100
    af-interface default
     authentication mode md5
     authentication key-chain EIGRP-KEYS
    exit-af-interface
    af-interface Loopback0
     passive-interface
    exit-af-interface
    network <each connected 10.0.x.0> 0.0.0.255
    network 10.255.0.N 0.0.0.0
    eigrp router-id 10.255.0.N
  ```
  - R1 networks: 10.0.12.0, 10.0.13.0 and 10.255.0.1
  - R2 networks: 10.0.12.0, 10.0.23.0 and 10.255.0.2
  - R3 networks: 10.0.13.0, 10.0.23.0 and 10.255.0.3, plus `eigrp stub connected`

  **Why it works:** neighbors need the same AS (100) and the same K-values. With `af-interface default` every interface
  uses MD5 with key 1, and a mismatched key would block the hellos. A passive loopback is still advertised but sends no
  hellos. The stub keyword stops R1 and R2 from querying R3 or using it as a transit path.
hints:
  - "Named mode puts the AS number under the address-family, not after `router eigrp`. All three routers must agree on it."
  - "Authentication is applied per interface. Look at the af-interface default section and a key chain with the same key ID and string."
  - "R3 must advertise only its connected networks to its neighbors, and loopbacks should not send hellos."
faults:
- id: r2-wrong-key
  title: Wrong EIGRP key-string on R2
  device: R2
  ticket: R2 has had no EIGRP neighbors since a password change. R1 and R3 are still neighbors with each other.
  config: |
    key chain EIGRP-KEYS
     key 1
      key-string WRONG
  explanation: |-
    **Root cause:** the key-string of key 1 in key chain EIGRP-KEYS on R2 was changed, so MD5 authentication fails with both neighbors.

    **Fix (R2):**
    ```
    key chain EIGRP-KEYS
     key 1
      key-string ENCOR
    ```
    EIGRP authentication needs the same key ID and key string on both neighbors.
  hints:
  - One router lost all its neighbors at once, so look at what all its adjacencies share.
  - Compare the key chain on R2 with R1's (`show key chain`).
  checks:
  - id: f-r2-cfg-key
    mode: config
    device: R2
    description: R2 key 1 of EIGRP-KEYS uses the shared key string
    match:
    - ^key chain EIGRP-KEYS\s*\n\s+key 1\s*\n\s+key-string ENCOR\s*$
    hint: key chain EIGRP-KEYS / key 1 / key-string ENCOR
- id: r1-missing-network
  title: R1 no longer runs EIGRP towards R3
  device: R1
  ticket: R1 and R3 are no longer EIGRP neighbors, while R1-R2 and R2-R3 are fine. Traffic from R1 to R3's loopback now goes through R2.
  config: |
    router eigrp ENCOR
     address-family ipv4 unicast autonomous-system 100
      no network 10.0.13.0 0.0.0.255
  explanation: |-
    **Root cause:** the `network 10.0.13.0 0.0.0.255` statement was removed from R1, so EIGRP is not enabled on the R1-R3 link.

    **Fix (R1):**
    ```
    router eigrp ENCOR
     address-family ipv4 unicast autonomous-system 100
      network 10.0.13.0 0.0.0.255
    ```
  hints:
  - Only one link is affected, so check that EIGRP runs on it at all.
  - Does `show ip eigrp interfaces` on R1 list the interface towards R3?
  checks:
  - id: f-r1-cfg-net13
    mode: config
    device: R1
    description: R1 enables EIGRP on the R1-R3 link
    match:
    - ^\s+network 10\.0\.13\.0 0\.0\.0\.255\s*$
    hint: network 10.0.13.0 0.0.0.255 under the address family
- id: r3-not-stub
  title: R3 is no longer a stub router
  device: R3
  ticket: During a WAN failure test, R1 started sending transit traffic for R2 through R3, which must never be used as a transit router.
  config: |
    router eigrp ENCOR
     address-family ipv4 unicast autonomous-system 100
      no eigrp stub connected
  explanation: |-
    **Root cause:** `eigrp stub connected` was removed from R3, so R3 advertises learned routes again and becomes a transit path.

    **Fix (R3):**
    ```
    router eigrp ENCOR
     address-family ipv4 unicast autonomous-system 100
      eigrp stub connected
    ```
    A stub router only advertises the route types it is told to and is never queried.
  hints:
  - Which router is designed to never carry transit traffic?
  - 'Look at the EIGRP address family on R3: what makes it a stub?'
  checks: []
version: "2"
