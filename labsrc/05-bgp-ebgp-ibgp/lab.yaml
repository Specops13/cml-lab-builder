id: 05-bgp-ebgp-ibgp
title: BGP - eBGP and iBGP with next-hop-self
blueprint: ["3.2.c"]
domain: "3.0 Infrastructure - Layer 3"
difficulty: 4
summary: Peer three autonomous systems, run iBGP between loopbacks over OSPF, fix the next-hop problem and advertise prefixes.
nodes:
  - name: R1
    kind: router
    x: -300
    y: 0
    config: |
      interface Loopback0
       ip address 10.255.0.1 255.255.255.255
      interface Loopback1
       ip address 192.168.1.1 255.255.255.0
      interface %if0%
       description eBGP to R2 (AS 65000)
       ip address 10.0.12.1 255.255.255.252
       no shutdown
  - name: R2
    kind: router
    x: -100
    y: 0
    config: |
      interface Loopback0
       ip address 10.255.0.2 255.255.255.255
       ip ospf 1 area 0
      interface %if0%
       description eBGP to R1 (AS 65001)
       ip address 10.0.12.2 255.255.255.252
       no shutdown
      interface %if1%
       description core link to R3
       ip address 10.0.23.2 255.255.255.252
       ip ospf 1 area 0
       no shutdown
      router ospf 1
       router-id 10.255.0.2
  - name: R3
    kind: router
    x: 100
    y: 0
    config: |
      interface Loopback0
       ip address 10.255.0.3 255.255.255.255
       ip ospf 1 area 0
      interface %if0%
       description core link to R2
       ip address 10.0.23.3 255.255.255.252
       ip ospf 1 area 0
       no shutdown
      interface %if1%
       description eBGP to R4 (AS 65002)
       ip address 10.0.34.3 255.255.255.252
       no shutdown
      router ospf 1
       router-id 10.255.0.3
  - name: R4
    kind: router
    x: 300
    y: 0
    config: |
      interface Loopback0
       ip address 10.255.0.4 255.255.255.255
      interface Loopback1
       ip address 192.168.4.1 255.255.255.0
      interface %if0%
       description eBGP to R3 (AS 65000)
       ip address 10.0.34.4 255.255.255.252
       no shutdown
links:
  - {a: {node: R1, port: 0}, b: {node: R2, port: 0}}
  - {a: {node: R2, port: 1}, b: {node: R3, port: 0}}
  - {a: {node: R3, port: 1}, b: {node: R4, port: 0}}
task: |
  # Lab 5 - eBGP and iBGP

  R1 (AS 65001) -- R2 (AS 65000) -- R3 (AS 65000) -- R4 (AS 65002).
  OSPF already runs inside AS 65000 (R2/R3) and carries their loopbacks.

  1. eBGP: R1 <-> R2 over 10.0.12.0/30, R3 <-> R4 over 10.0.34.0/30.
  2. iBGP: R2 <-> R3 between Loopback0 addresses (10.255.0.2 / 10.255.0.3) using `update-source Loopback0`.
  3. Fix the iBGP next-hop problem with `next-hop-self` on R2 and R3 toward their iBGP peer.
  4. R1 advertises 192.168.1.0/24 and R4 advertises 192.168.4.0/24 into BGP (network statements).
  5. BGP router IDs = Loopback0 addresses.
  6. R1 must ping 192.168.4.1 sourced from 192.168.1.1.

  Verify with `show ip bgp summary`, `show ip bgp`, `show ip route bgp`.
checks:
  - id: r2-ebgp
    description: R2 eBGP session to R1 (AS 65001) is Established
    device: R2
    command: show ip bgp summary
    match: ['^10\.0\.12\.1\s+4\s+65001\s.*\s\d+\s*$']
    hint: neighbor 10.0.12.1 remote-as 65001 on R2 and neighbor 10.0.12.2 remote-as 65000 on R1
  - id: r2-ibgp
    description: R2 iBGP session to 10.255.0.3 is Established
    device: R2
    command: show ip bgp summary
    match: ['^10\.255\.0\.3\s+4\s+65000\s.*\s\d+\s*$']
    hint: iBGP between loopbacks needs 'neighbor 10.255.0.3 update-source Loopback0' on both sides.
  - id: r3-sessions
    description: R3 sessions to R2 (iBGP) and R4 (eBGP) are Established
    device: R3
    command: show ip bgp summary
    match: ['^10\.255\.0\.2\s+4\s+65000\s.*\s\d+\s*$', '^10\.0\.34\.4\s+4\s+65002\s.*\s\d+\s*$']
  - id: r2-nhs
    description: R2 learns 192.168.4.0 from iBGP with next hop 10.255.0.3 (next-hop-self)
    device: R2
    command: show ip bgp
    match: ['\*>i\s*192\.168\.4\.0\s+10\.255\.0\.3\s']
    hint: neighbor 10.255.0.2 next-hop-self on R3
  - id: r1-path
    description: R1 has a best path to 192.168.4.0 with AS path 65000 65002
    device: R1
    command: show ip bgp
    match: ['\*>\s+192\.168\.4\.0\s+10\.0\.12\.2\s.*65000 65002 i']
  - id: r4-path
    description: R4 has a best path to 192.168.1.0 with AS path 65000 65001
    device: R4
    command: show ip bgp
    match: ['\*>\s+192\.168\.1\.0\s+10\.0\.34\.3\s.*65000 65001 i']
  - id: r1-ping
    description: End-to-end reachability 192.168.1.1 -> 192.168.4.1
    device: R1
    command: ping 192.168.4.1 source 192.168.1.1 repeat 5
    min_success: 80
  # ---- config-mode checks (running config via CML API) ----
  - id: r2-cfg-bgp
    mode: config
    description: R2 BGP AS 65000 with eBGP and iBGP neighbors
    device: R2
    match:
    - ^router bgp 65000
    - ^\s+neighbor 10\.0\.12\.1 remote-as 65001
    - ^\s+neighbor 10\.255\.0\.3 remote-as 65000
  - id: r2-cfg-ibgp
    mode: config
    description: R2 iBGP uses Loopback0 and next-hop-self
    device: R2
    match:
    - ^\s+neighbor 10\.255\.0\.3 update-source Loopback0
    - ^\s+neighbor 10\.255\.0\.3 next-hop-self
  - id: r3-cfg-ibgp
    mode: config
    description: R3 iBGP uses Loopback0 and next-hop-self
    device: R3
    match:
    - ^\s+neighbor 10\.255\.0\.2 update-source Loopback0
    - ^\s+neighbor 10\.255\.0\.2 next-hop-self
  - id: r1-cfg-net
    mode: config
    description: R1 advertises 192.168.1.0/24
    device: R1
    match:
    - ^router bgp 65001
    - ^\s+network 192\.168\.1\.0( mask 255\.255\.255\.0)?\s*$
  - id: r4-cfg-net
    mode: config
    description: R4 advertises 192.168.4.0/24
    device: R4
    match:
    - ^router bgp 65002
    - ^\s+network 192\.168\.4\.0( mask 255\.255\.255\.0)?\s*$
solution_summary: |
  **What was missing:** BGP was not configured, and the iBGP next hop for eBGP-learned routes was unreachable.

  **Fix**
  ```
  ! R1 (AS 65001)
  router bgp 65001
   bgp router-id 10.255.0.1
   network 192.168.1.0
   neighbor 10.0.12.2 remote-as 65000
  ! R2 (AS 65000)
  router bgp 65000
   bgp router-id 10.255.0.2
   neighbor 10.0.12.1 remote-as 65001
   neighbor 10.255.0.3 remote-as 65000
   neighbor 10.255.0.3 update-source Loopback0
   neighbor 10.255.0.3 next-hop-self
  ! R3 (AS 65000)
  router bgp 65000
   bgp router-id 10.255.0.3
   neighbor 10.0.34.4 remote-as 65002
   neighbor 10.255.0.2 remote-as 65000
   neighbor 10.255.0.2 update-source Loopback0
   neighbor 10.255.0.2 next-hop-self
  ! R4 (AS 65002)
  router bgp 65002
   bgp router-id 10.255.0.4
   network 192.168.4.0
   neighbor 10.0.34.3 remote-as 65000
  ```

  **Why it works:** eBGP peers on the directly connected links. iBGP peers between loopbacks, which OSPF makes reachable,
  so `update-source Loopback0` is needed on both sides. iBGP doesn't change the next hop, so without `next-hop-self` R3
  would see R1's prefix via 10.0.12.1, an address it can't reach.
hints:
  - "Start with the eBGP sessions on the directly connected links. Each side names the other AS."
  - "The iBGP session runs between loopbacks: both routers must source it from Loopback0."
  - "The iBGP session is up but the routes aren't best (no `>`)? Check the next hop of the eBGP-learned prefixes."
faults:
- id: r2-no-nhs
  title: next-hop-self missing on R2
  device: R2
  ticket: R4 (AS 65002) cannot reach 192.168.1.0/24. On R3 the BGP route to 192.168.1.0 is present but not marked best (no >).
  config: |
    router bgp 65000
     no neighbor 10.255.0.3 next-hop-self
  explanation: |-
    **Root cause:** R2 no longer sets itself as next hop towards its iBGP peer R3. R3 receives 192.168.1.0/24 with next hop 10.0.12.1, which it cannot resolve.

    **Fix (R2):**
    ```
    router bgp 65000
     neighbor 10.255.0.3 next-hop-self
    ```
    eBGP next hops are carried unchanged into iBGP, so the iBGP peer must be able to reach them.
  hints:
  - A BGP route that is received but never best is usually not usable. Why?
  - 'Check the Next Hop column of `show ip bgp` on R3: can R3 reach that address?'
  checks: []
- id: r3-no-update-source
  title: Wrong iBGP update source on R3
  device: R3
  ticket: The iBGP session between R2 and R3 is stuck in Active/Idle since R3 was reloaded with a 'cleaned up' config. Both loopbacks are reachable.
  config: |
    router bgp 65000
     no neighbor 10.255.0.2 update-source Loopback0
  explanation: |-
    **Root cause:** R3 sources its iBGP session from the physical interface, but R2 expects the session from R3's Loopback0 (10.255.0.3), so R2 rejects it.

    **Fix (R3):**
    ```
    router bgp 65000
     neighbor 10.255.0.2 update-source Loopback0
    ```
    With loopback peering, both peers must source the TCP session from their loopback.
  hints:
  - The loopbacks can reach each other, so look at how the TCP session is sourced.
  - Compare the neighbor statements for the iBGP peer on R2 and R3.
  checks: []
- id: r1-wrong-remote-as
  title: Wrong remote-as on R1
  device: R1
  ticket: 'R2 logs ''BGP notification sent: bad remote AS'' for 10.0.12.1 every minute. R1 has no BGP routes at all.'
  config: |
    router bgp 65001
     neighbor 10.0.12.2 remote-as 65010
  explanation: |-
    **Root cause:** R1's neighbor statement for R2 uses remote-as 65010, but R2 is in AS 65000, so the OPEN messages are rejected.

    **Fix (R1):**
    ```
    router bgp 65001
     neighbor 10.0.12.2 remote-as 65000
    ```
  hints:
  - BGP OPEN messages carry the AS number, and the peer checks it.
  - Does R1's `neighbor 10.0.12.2 remote-as` match R2's actual AS?
  checks:
  - id: f-r1-cfg-remote-as
    mode: config
    device: R1
    description: R1 peers with R2 in AS 65000
    match:
    - ^\s+neighbor 10\.0\.12\.2 remote-as 65000\s*$
    hint: neighbor 10.0.12.2 remote-as 65000
version: "2"
