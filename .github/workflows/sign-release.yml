# Sign an already published release (3.3.9+): Actions > sign release > Run workflow, enter the tag.
# Downloads SHA256SUMS.txt and cml-lab-builder-patch-<version>.zip from that release, checks the patch against the sums,
# signs both with the RELEASE_SIGNING_KEY secret (packaging/sign_release.py refuses a key the app does not trust) and
# uploads the two .sig files, and fills in empty release notes from CHANGELOG.md. Existing .sig assets are never replaced (gh release upload without --clobber fails).
# New releases are signed by the release job in build.yml; this is for releases published before the secret existed.
name: sign release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign, e.g. v3.3.9"
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: sign-release-${{ inputs.tag }}
jobs:
  sign:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet cryptography
      - name: Download SHA256SUMS.txt and the patch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p SHA256SUMS.txt -p 'cml-lab-builder-patch-*.zip'
          cd dist && sha256sum -c SHA256SUMS.txt --ignore-missing
      - name: Sign (Ed25519, SECURITY.md)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python packaging/sign_release.py --dist dist
      - name: Upload the signatures
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/*.sig
      - name: Release notes from CHANGELOG.md (only if the release has none)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
            awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
            if [ -s release-notes.md ]; then gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file release-notes.md; fi
          fi
