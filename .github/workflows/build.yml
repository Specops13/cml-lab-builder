# Builds and smoke-tests the ready-to-run Windows and Linux bundles.
#  - push of a tag "v*": build + test only; bundles are kept as workflow artifacts (nothing is published, so
#    assets uploaded to an existing release by hand are never overwritten).
#  - Actions > build > Run workflow: same, and with "publish" ticked it creates/updates the GitHub Release for
#    the given tag. Existing assets with the same name are NOT replaced (overwrite_files: false).
#  - every run also builds encorlab-patch-<version>.zip (app code only, used by the in-app "Install update")
#    and checks packaging/runtime.lock.json, so a runtime change cannot ship as a patch by accident.
#  - the Linux job also wraps the smoke-tested Linux build into encorlab_<version>_amd64.deb (lintian +
#    desktop-file-validate), and deb-test installs it in a clean Debian 12 container and smoke-tests it.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the bundles to the GitHub Release for the tag below"
        type: boolean
        default: false
      tag:
        description: "Release tag, e.g. v1.4.1 (must exist)"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" && python -m pytest -q
      # the runtime (Python, libraries, boot loader, spec) must not change without bumping RUNTIME_VERSION
      - run: python packaging/build_patch.py --check-lock
  patch:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build the app-code patch (encorlab-patch-<version>.zip, for in-app "Install update")
        run: python packaging/build_patch.py --check-lock --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: encorlab-patch
          path: dist/encorlab-patch-*.zip
          if-no-files-found: error
  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, artifact: windows}
          - {os: ubuntu-22.04, artifact: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'
      - name: Build + smoke test (Linux, glibc 2.28 baseline)
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh --smoke
      - name: Debian package from the same build (encorlab_<version>_amd64.deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian desktop-file-utils
          python3 packaging/build_deb.py --out dist
          lintian --fail-on error dist/encorlab_*.deb
          dpkg-deb -x dist/encorlab_*.deb /tmp/debroot
          desktop-file-validate /tmp/debroot/usr/share/applications/encorlab.desktop
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with: {python-version: "3.12"}
      - name: Build + smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build_exe.bat --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ENCORLab-${{ matrix.artifact }}
          path: |
            dist/ENCORLab-*
            dist/encorlab_*.deb
          if-no-files-found: error
  deb-test:
    needs: bundle
    runs-on: ubuntu-22.04
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: ENCORLab-linux, path: dist}
      - name: apt install the .deb on a clean Debian 12, then smoke-test it as a normal user
        run: |
          apt-get update -qq
          apt-get install -y ./dist/encorlab_*.deb
          apt-get install -y -qq python3 desktop-file-utils
          desktop-file-validate /usr/share/applications/encorlab.desktop
          useradd -m tester && cp -r . /home/tester/src && chown -R tester /home/tester/src
          V=$(dpkg-query -W -f='${Version}' encorlab)
          su tester -c "cd ~ && python3 src/packaging/smoke_test.py /usr/bin/encorlab --version $V \
            --data-dir /home/tester/.config/cml-lab-builder --patch-test --auto-update-test"
          test -L /usr/bin/cmllab && su tester -c "cmllab version"
          test -z "$(dpkg --verify encorlab)"   # updates went to ~/.config/encorlab/app, /opt untouched
          apt-get purge -y encorlab && test ! -e /opt/encorlab && test ! -e /usr/bin/cmllab \
            && test -d /home/tester/.config/encorlab && test -d /home/tester/.config/cml-lab-builder
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != ''
    needs: [bundle, patch, deb-test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      # the in-app updater verifies the patch against SHA256SUMS.txt of the same release
      - run: cd dist && sha256sum ENCORLab-* encorlab_*.deb encorlab-patch-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          overwrite_files: false
          files: |
            dist/ENCORLab-*
            dist/encorlab_*.deb
            dist/encorlab-patch-*.zip
            dist/SHA256SUMS.txt
