# CI for CML Lab Builder (3.3.5: fast checks on every push/PR, full suite + bundles only for releases).
#  - push to main / pull request: lint (ruff incl. security rules, runtime lock, app.js syntax) and the fast tests
#    (pytest -n auto -m "not slow") in parallel. Bundles and the .deb test run on PRs only when packaging changes.
#  - push of a tag "v*": the full test suite (slow end-to-end tests included), the patch zip, the Windows/Linux
#    bundles + .deb (lintian, desktop-file-validate) and deb-test, all started in parallel; bundles are kept as
#    workflow artifacts (nothing is published, so assets uploaded to an existing release by hand are never overwritten).
#  - Actions > build > Run workflow: same as a tag, and with "publish" ticked it creates/updates the GitHub Release for
#    the given tag. Existing assets with the same name are NOT replaced (overwrite_files: false).
#  - the patch job builds cml-lab-builder-patch-<version>.zip (app code only, used by the in-app "Install update")
#    and checks packaging/runtime.lock.json, so a runtime change cannot ship as a patch by accident.
#  - the release also carries the transition files for ENCOR Lab Builder 1.7 - 2.1 (packaging/build_compat.py).
#  - 3.3.0+: the app only installs updates whose SHA256SUMS.txt (and patch zip) carry an Ed25519 signature
#    (*.sig, see SECURITY.md). The release key is NOT in this repository; the maintainer signs the published
#    SHA256SUMS.txt and patch locally and uploads the .sig files.
#  - caches: pip (setup-python), uv (Linux bundle) and the PyInstaller bin cache, keyed on pyproject.toml and the
#    runtime lock.
name: CML Lab Builder build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the bundles to the GitHub Release for the tag below"
        type: boolean
        default: false
      tag:
        description: "Release tag, e.g. v1.4.1 (must exist)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  # a newer push to the same branch/PR cancels the older run; tag and manual runs are never cancelled
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
env:
  # tags and manual runs build releases; pushes and PRs only lint and run the fast tests
  RELEASE_RUN: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
jobs:
  changes:
    # does this PR touch packaging? (then the bundles and the .deb test run for it too)
    runs-on: ubuntu-22.04
    outputs:
      packaging: ${{ steps.f.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --name-only "$BASE" HEAD \
               | grep -qE '^(packaging/|pyproject\.toml|cmlboot\.py|cmllab_launcher\.py|\.github/workflows/)'; then
            echo packaging=true >> "$GITHUB_OUTPUT"
          else
            echo packaging=false >> "$GITHUB_OUTPUT"
          fi
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      # security gates: flake8-bandit rules (ruff "S", configured in pyproject.toml); tests are linted too
      - name: ruff (incl. security rules)
        run: pip install -q "ruff>=0.6" && ruff check cmllab cmlboot.py cmllab_launcher.py tests
      # the runtime (Python, libraries, boot loader, spec) must not change without bumping RUNTIME_VERSION
      - run: python packaging/build_patch.py --check-lock
      - run: node --check cmllab/web/static/app.js
      - name: Dependency audit (pip-audit)
        run: pip install -q -e . "pip-audit>=2.7" && pip-audit --skip-editable --progress-spinner off
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -q -e ".[dev]"
      # parallel (pytest-xdist); the slow end-to-end tests (@pytest.mark.slow) only run for releases
      - name: tests (fast set on push/PR, full suite on tags)
        run: |
          if [ "$RELEASE_RUN" = "true" ]; then python -m pytest -q -n auto --durations=15
          else python -m pytest -q -n auto -m "not slow" --durations=10; fi
  patch:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build the app-code patch (cml-lab-builder-patch-<version>.zip, for in-app "Install update")
        run: python packaging/build_patch.py --check-lock --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: cml-lab-builder-patch
          path: dist/cml-lab-builder-patch-*.zip
          if-no-files-found: error
  bundle:
    # starts together with lint/test (no "needs: test"); the release job waits for everything
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, artifact: windows}
          - {os: ubuntu-22.04, artifact: linux}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pyinstaller
            ~/AppData/Local/pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('packaging/runtime.lock.json', 'pyproject.toml') }}
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'
        with: {enable-cache: true, cache-dependency-glob: "pyproject.toml"}
      - name: Build + smoke test (Linux, glibc 2.28 baseline)
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh --smoke
      - name: Debian package from the same build (cml-lab-builder_<version>_amd64.deb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian desktop-file-utils
          python3 packaging/build_deb.py --out dist
          lintian --fail-on error dist/cml-lab-builder_*.deb
          dpkg-deb -x dist/cml-lab-builder_*.deb /tmp/debroot
          desktop-file-validate /tmp/debroot/usr/share/applications/cml-lab-builder.desktop
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with: {python-version: "3.12", cache: pip, cache-dependency-path: pyproject.toml}
      - name: Build + smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build_exe.bat --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: CMLLabBuilder-${{ matrix.artifact }}
          path: |
            dist/CMLLabBuilder-*
            dist/cml-lab-builder_*.deb
          if-no-files-found: error
  deb-test:
    # The .deb end to end in a fresh Debian 12 container pinned by digest (packaging/deb_docker_test.sh, the same
    # checks as the local packaging/deb_chroot_test.sh): apt install with deps, menu entry + launch (waits for the
    # port), single instance, smoke test with patch + auto-update tests as a normal user, /opt and dpkg --verify
    # untouched, deb upgrades vs. a user patch, remove + purge keep the user data. Every check prints PASS/FAIL.
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: CMLLabBuilder-linux, path: dist}
      - name: install, launch, smoke-test, upgrade and purge the .deb on a clean Debian 12 as a normal user
        run: packaging/deb_docker_test.sh dist/cml-lab-builder_*_amd64.deb
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.tag != ''
    needs: [lint, test, bundle, patch, deb-test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      # old-name copies + manifest-only encorlab-patch for ENCOR Lab Builder 1.7 - 2.1 (see packaging/build_compat.py)
      - run: python3 packaging/build_compat.py --dist dist
      # the in-app updater verifies the patch against SHA256SUMS.txt of the same release
      - run: cd dist && sha256sum CMLLabBuilder-* cml-lab-builder_*.deb cml-lab-builder-patch-*.zip ENCORLab-* encorlab_*.deb encorlab-patch-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          overwrite_files: false
          files: |
            dist/CMLLabBuilder-*
            dist/cml-lab-builder_*.deb
            dist/cml-lab-builder-patch-*.zip
            dist/ENCORLab-*
            dist/encorlab_*.deb
            dist/encorlab-patch-*.zip
            dist/SHA256SUMS.txt
