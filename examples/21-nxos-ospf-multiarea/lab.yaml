id: 21-nxos-ospf-multiarea
type: walkthrough
title: "NX-OS study path 1/3: OSPF multi-area on a super-spine Clos, with deep debug inspection"
blueprint: ["3.2.b"]
domain: "3.0 Infrastructure"
difficulty: 4
platforms: [iol]
summary: "Lab 1 of the NX-OS study path (OSPF -> BGP -> BGP EVPN VXLAN). Six Nexus 9000v in a 5-stage Clos (2 super spines, a spine and a leaf per pod). Build the OSPF underlay step by step: area 0 on the super-spine layer, one area per pod with the spines as ABRs, a DR/BDR segment, inter-area summarization with discard routes, an NSSA with a translated external, and a stub area. Every step explains what NX-OS does under the hood and how to inspect it with show, event-history and filtered debugs written to a debug logfile."
author: CML Lab Builder
version: "1"
ram_gb: 76
