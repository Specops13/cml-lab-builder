    kind: router
    definition: nxosv9000
    x: -150
    y: -420
    config: |
      ! Lab 21 baseline (the start of this lab): hostname, logins, interface descriptions and links enabled. No IP addressing, no routing. This lab is built fresh from this config.
      interface Ethernet1/1
        description to P1-SPINE Eth1/1
        no shutdown
      interface Ethernet1/2
        description to P2-SPINE Eth1/1
        no shutdown
      interface Ethernet1/3
