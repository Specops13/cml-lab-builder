id: 24-dmvpn-phase3
type: walkthrough
title: 'Walkthrough: DMVPN Phase 3 with NHRP and EIGRP (IOS-XE, IOL)'
blueprint:
- 2.2.b
domain: 2.0 Virtualization
difficulty: 4
platforms:
- iol
summary: Step-by-step build of a single-hub DMVPN Phase 3 cloud over a simulated Internet - mGRE tunnels, dynamic NHRP registration,
  EIGRP stub spokes over the tunnel, NHRP redirect/shortcut spoke-to-spoke tunnels and hub summarisation, plus a fault-finding
  guide.
author: CML Lab Builder
version: '1'
nodes:
- name: INET
  kind: router
  x: 0
  y: -150
  config: |
    ! Simulated Internet (ISP). Fully configured at day-0 - do not change it. It only knows its connected /30s, so the overlay must carry all private traffic.
    interface %if0%
     description to HUB (Internet access)
     ip address 203.0.113.1 255.255.255.252
     no shutdown
    interface %if1%
     description to SPOKE1 (Internet access)
     ip address 198.51.100.1 255.255.255.252
     no shutdown
    interface %if2%
     description to SPOKE2 (Internet access)
     ip address 198.51.100.5 255.255.255.252
     no shutdown
    interface %if3%
     description to SPOKE3 (Internet access)
     ip address 198.51.100.9 255.255.255.252
     no shutdown
- name: HUB
  kind: router
  x: 0
  y: 0
  config: |
    ! DMVPN hub (NHS). Day-0: hostname, interface descriptions and the Internet link enabled (no IP addressing yet). You build the rest in the walkthrough steps.
    interface %if0%
     description to INET (DMVPN underlay / NBMA)
     no ip address
     no shutdown
    interface %if1%
     description unused
     no ip address
     shutdown
    interface %if2%
     description unused
     no ip address
     shutdown
    interface %if3%
     description unused
     no ip address
     shutdown
- name: SPOKE1
  kind: router
  x: -250
  y: 180
  config: |
    ! DMVPN spoke. Day-0: hostname, interface descriptions and the Internet link enabled (no IP addressing yet).
    interface %if0%
     description to INET (DMVPN underlay / NBMA)
     no ip address
     no shutdown
    interface %if1%
     description unused
     no ip address
     shutdown
    interface %if2%
     description unused
     no ip address
     shutdown
    interface %if3%
     description unused
     no ip address
     shutdown
- name: SPOKE2
  kind: router
  x: 0
  y: 180
  config: |
    ! DMVPN spoke. Day-0: hostname, interface descriptions and the Internet link enabled (no IP addressing yet).
    interface %if0%
     description to INET (DMVPN underlay / NBMA)
     no ip address
     no shutdown
    interface %if1%
     description unused
     no ip address
     shutdown
    interface %if2%
     description unused
     no ip address
     shutdown
    interface %if3%
     description unused
     no ip address
     shutdown
- name: SPOKE3
  kind: router
  x: 250
  y: 180
  config: |
    ! DMVPN spoke. Day-0: hostname, interface descriptions and the Internet link enabled (no IP addressing yet).
    interface %if0%
     description to INET (DMVPN underlay / NBMA)
     no ip address
     no shutdown
    interface %if1%
     description unused
     no ip address
     shutdown
    interface %if2%
     description unused
     no ip address
     shutdown
    interface %if3%
     description unused
     no ip address
     shutdown
links:
- a:
    node: INET
    port: 0
  b:
    node: HUB
    port: 0
- a:
    node: INET
    port: 1
  b:
    node: SPOKE1
    port: 0
- a:
    node: INET
    port: 2
  b:
    node: SPOKE2
    port: 0
- a:
    node: INET
    port: 3
  b:
    node: SPOKE3
