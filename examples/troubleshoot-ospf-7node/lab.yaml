id: troubleshoot-ospf-7node
title: "Troubleshooting: Branch-2 Cannot Reach the Data-Center Server"
blueprint: ["3.2.b"]
domain: "3.0 Infrastructure - Layer 3"
difficulty: 3
platforms: [iol]
summary: "Seven-router multi-area OSPF enterprise, fully configured. Users at Branch-2 can't reach the DC server. Find and fix the one fault."
author: CML Lab Builder
version: "3"
nodes:
  - name: CORE1
    kind: router
    x: -120
    y: -200
    config: |
      interface Loopback0
       ip address 1.1.1.1 255.255.255.255
      interface %if0%
       description CORE1-CORE2
       ip address 10.0.12.1 255.255.255.0
       no shutdown
      interface %if1%
       description CORE1-DIST1
       ip address 10.0.13.1 255.255.255.0
       no shutdown
      interface %if2%
       description CORE1-EDGE
       ip address 10.0.17.1 255.255.255.0
       no shutdown
      router ospf 1
       router-id 1.1.1.1
       network 1.1.1.1 0.0.0.0 area 0
       network 10.0.12.0 0.0.0.255 area 0
       network 10.0.13.0 0.0.0.255 area 0
       network 10.0.17.0 0.0.0.255 area 0
  - name: CORE2
    kind: router
    x: 120
    y: -200
    config: |
      interface Loopback0
       ip address 2.2.2.2 255.255.255.255
      interface Loopback1
       description DC server segment
       ip address 10.100.0.10 255.255.255.0
       ip ospf network point-to-point
      interface %if0%
       description CORE2-CORE1
       ip address 10.0.12.2 255.255.255.0
       no shutdown
      interface %if1%
       description CORE2-DIST2
       ip address 10.0.24.2 255.255.255.0
       no shutdown
      router ospf 1
       router-id 2.2.2.2
       network 2.2.2.2 0.0.0.0 area 0
       network 10.100.0.0 0.0.0.255 area 0
       network 10.0.12.0 0.0.0.255 area 0
       network 10.0.24.0 0.0.0.255 area 0
  - name: DIST1
    kind: router
    x: -120
    y: 0
    config: |
      interface Loopback0
       ip address 3.3.3.3 255.255.255.255
      interface %if0%
       description DIST1-CORE1
       ip address 10.0.13.3 255.255.255.0
       no shutdown
      interface %if1%
       description DIST1-BR1 WAN
       ip address 10.1.35.3 255.255.255.0
       no shutdown
      router ospf 1
       router-id 3.3.3.3
       network 3.3.3.3 0.0.0.0 area 0
       network 10.0.13.0 0.0.0.255 area 0
       network 10.1.35.0 0.0.0.255 area 1
  - name: DIST2
    kind: router
    x: 120
    y: 0
    config: |
      interface Loopback0
       ip address 4.4.4.4 255.255.255.255
      interface %if0%
       description DIST2-CORE2
       ip address 10.0.24.4 255.255.255.0
       no shutdown
      interface %if1%
       description DIST2-BR2 WAN
       ip address 10.2.46.4 255.255.255.0
       ip ospf authentication message-digest
       ip ospf message-digest-key 1 md5 ENCOR-TS1
       no shutdown
      router ospf 1
       router-id 4.4.4.4
       network 4.4.4.4 0.0.0.0 area 0
       network 10.0.24.0 0.0.0.255 area 0
       network 10.2.46.0 0.0.0.255 area 2
  - name: BR1
    kind: router
    x: -120
    y: 200
    config: |
      interface Loopback0
       ip address 5.5.5.5 255.255.255.255
      interface Loopback1
       description Branch-1 users
       ip address 10.1.100.1 255.255.255.0
       ip ospf network point-to-point
      interface %if0%
       description BR1-DIST1 WAN
       ip address 10.1.35.5 255.255.255.0
       no shutdown
      router ospf 1
       router-id 5.5.5.5
       network 5.5.5.5 0.0.0.0 area 1
       network 10.1.100.0 0.0.0.255 area 1
       network 10.1.35.0 0.0.0.255 area 1
  - name: BR2
    kind: router
    x: 120
    y: 200
    config: |
      interface Loopback0
       ip address 6.6.6.6 255.255.255.255
      interface Loopback1
       description Branch-2 users
       ip address 10.2.100.1 255.255.255.0
       ip ospf network point-to-point
      interface %if0%
       description BR2-DIST2 WAN
