id: 20-evpn-vxlan-superspine
type: walkthrough
title: "Walkthrough: BGP EVPN VXLAN across two data centers with super spines (5-stage Clos)"
blueprint: ["2.3", "1.1.a"]
domain: "2.0 Virtualization"
difficulty: 5
platforms: [iol]
summary: Step-by-step build of one VXLAN EVPN fabric spanning two data centers (two spine-and-leaf pods) joined by a super-spine layer - Cisco's 5-stage Clos. OSPF underlay through leaf-spine-super spine-spine-leaf, iBGP EVPN with the super spines as route reflectors, NX-OS VTEPs, VLANs 10 and 20 stretched across both DCs (optional L3VNI VRF with a distributed anycast gateway).
author: CML Lab Builder
version: "3"
nodes:
  - name: SS1
    kind: router
    x: -150
    y: -420
    config: |
      ! Super spine 1 (BGP EVPN route reflector). Day-0: hostname, interface descriptions and links enabled (no IP addressing yet). You build the rest in the walkthrough steps.
      interface %if0%
       description to DC1-SPINE
       no ip address
       no shutdown
      interface %if1%
       description to DC2-SPINE
       no ip address
       no shutdown
      interface %if2%
       description unused
       no ip address
       shutdown
      interface %if3%
       description unused
       no ip address
       shutdown
  - name: SS2
    kind: router
    x: 150
    y: -420
    config: |
      ! Super spine 2 (BGP EVPN route reflector). Day-0: hostname, interface descriptions and links enabled (no IP addressing yet). You build the rest in the walkthrough steps.
      interface %if0%
       description to DC1-SPINE
       no ip address
       no shutdown
      interface %if1%
       description to DC2-SPINE
       no ip address
       no shutdown
      interface %if2%
       description unused
       no ip address
       shutdown
      interface %if3%
       description unused
       no ip address
       shutdown
  - name: DC1-SPINE
    kind: router
    x: -300
    y: -220
    config: |
      ! DC1 spine. Day-0: hostname, interface descriptions and links enabled (no IP addressing yet). You build the rest in the walkthrough steps.
      interface %if0%
       description to SS1
       no ip address
       no shutdown
      interface %if1%
       description to SS2
       no ip address
       no shutdown
      interface %if2%
       description to DC1-LEAF1
       no ip address
       no shutdown
      interface %if3%
       description to DC1-LEAF2
       no ip address
       no shutdown
  - name: DC2-SPINE
    kind: router
    x: 300
    y: -220
    config: |
      ! DC2 spine. Day-0: hostname, interface descriptions and links enabled (no IP addressing yet). You build the rest in the walkthrough steps.
      interface %if0%
       description to SS1
       no ip address
       no shutdown
      interface %if1%
       description to SS2
       no ip address
       no shutdown
      interface %if2%
       description to DC2-LEAF1
       no ip address
       no shutdown
      interface %if3%
       description to DC2-LEAF2
       no ip address
       no shutdown
  - name: DC1-LEAF1
    kind: switch
    definition: nxosv9000
    x: -420
    y: 0
    config: |
      ! Day-0: hostname, logins, interface descriptions and links enabled. You build the rest in the walkthrough steps.
      interface Ethernet1/1
        description to DC1-SPINE
        no shutdown
      interface Ethernet1/2
        description to H1
        no shutdown
  - name: DC1-LEAF2
    kind: switch
    definition: nxosv9000
    x: -180
    y: 0
    config: |
      ! Day-0: hostname, logins, interface descriptions and links enabled. You build the rest in the walkthrough steps.
      interface Ethernet1/1
        description to DC1-SPINE
        no shutdown
      interface Ethernet1/2
        description to H2
        no shutdown
  - name: DC2-LEAF1
    kind: switch
    definition: nxosv9000
    x: 180
    y: 0
    config: |
      ! Day-0: hostname, logins, interface descriptions and links enabled. You build the rest in the walkthrough steps.
      interface Ethernet1/1
        description to DC2-SPINE
        no shutdown
      interface Ethernet1/2
        description to H3
        no shutdown
