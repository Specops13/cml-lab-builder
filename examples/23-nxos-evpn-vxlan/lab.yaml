        description to P1-SPINE Eth1/1
        no shutdown
      interface Ethernet1/2
        description to P2-SPINE Eth1/1
        no shutdown
      interface Ethernet1/3
        description to SS2 Eth1/3
        no shutdown
      interface Ethernet1/4
        description unused
        shutdown
      interface Ethernet1/1
