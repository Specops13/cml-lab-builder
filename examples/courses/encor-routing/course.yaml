id: encor-routing
title: "ENCOR Infrastructure: routing track"
description: >-
  The core routing labs in a sensible order: EIGRP, OSPF, BGP, VRF-lite, PBR and
  OSPF/EIGRP redistribution. No labs are bundled,
  so this course is tiny and only records the study order and your progress through it.
author: CML Lab Builder
