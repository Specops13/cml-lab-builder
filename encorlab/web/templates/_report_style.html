<style>
  :root{--fg:#1b2430;--muted:#5b6675;--line:#d5dae1;--ok:#137333;--bad:#b3261e;--accent:#1a5fb4}
  *{box-sizing:border-box}body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,"DejaVu Sans",sans-serif;color:var(--fg);margin:0;background:#f4f6f9}
  .page{max-width:920px;margin:1.2rem auto;background:#fff;padding:1.6rem 2rem;border:1px solid var(--line);border-radius:8px}
  h1{font-size:1.45rem;margin:.1rem 0 .2rem}h2{font-size:1.1rem;margin:1.3rem 0 .4rem;border-bottom:2px solid var(--accent);padding-bottom:.15rem}
  h3{font-size:1rem;margin:.9rem 0 .3rem}.muted{color:var(--muted)}.small{font-size:.85em}
  table{border-collapse:collapse;width:100%;margin:.3rem 0}th,td{border-bottom:1px solid var(--line);padding:.3rem .45rem;text-align:left;vertical-align:top}
  th{background:#eef2f7;font-weight:600}.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
  .kpis{display:flex;flex-wrap:wrap;gap:.6rem;margin:.5rem 0}.kpi{border:1px solid var(--line);border-radius:8px;padding:.45rem .8rem;min-width:9rem}
  .kpi b{display:block;font-size:1.35rem}.tag{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 .45rem;margin-right:.2rem;font-size:.8em}
  .bar{display:inline-block;width:110px;height:9px;background:var(--line);border-radius:5px;overflow:hidden;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--accent)}pre{white-space:pre-wrap;font:12px/1.35 Consolas,"DejaVu Sans Mono",monospace;background:#f6f8fa;padding:.5rem;border-radius:5px;margin:.2rem 0}
  .toolbar{display:flex;gap:.5rem;justify-content:flex-end;margin-bottom:.5rem}button{font:inherit;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.result{font-size:1.25rem}
  .box{border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;margin:.5rem 0}
  @media print{body{background:#fff}.page{border:0;margin:0;max-width:none;padding:0}.noprint{display:none}h2{break-after:avoid}tr{break-inside:avoid}
    @page{margin:14mm}}
</style>
