! device R1
interface Loopback0
 ip ospf 1 area 0
interface %if0%
 ip ospf network point-to-point
 ip ospf 1 area 0
interface %if1%
 ip ospf network point-to-point
 ip ospf 1 area 1
router ospf 1
 router-id 10.255.0.1
 area 1 stub
 area 1 range 172.16.30.0 255.255.254.0
 passive-interface Loopback0
! device R2
interface Loopback0
 ip ospf 1 area 0
interface %if0%
 ip ospf network point-to-point
 ip ospf 1 area 0
interface %if1%
 ip ospf network point-to-point
 ip ospf 1 area 2
router ospf 1
 router-id 10.255.0.2
 passive-interface Loopback0
! device R3
interface Loopback0
 ip ospf 1 area 1
interface Loopback1
 ip ospf network point-to-point
 ip ospf 1 area 1
interface Loopback2
 ip ospf network point-to-point
 ip ospf 1 area 1
interface %if0%
 ip ospf network point-to-point
 ip ospf 1 area 1
router ospf 1
 router-id 10.255.0.3
 area 1 stub
 passive-interface Loopback0
 passive-interface Loopback1
 passive-interface Loopback2
! device R4
interface Loopback0
 ip ospf 1 area 2
interface %if0%
 ip ospf network point-to-point
 ip ospf 1 area 2
router ospf 1
 router-id 10.255.0.4
 passive-interface Loopback0
