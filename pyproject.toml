[build-system]
requires = ["setuptools>=77", "wheel"]   # >=77: SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "encorlab"
version = "2.1.0"
description = "CML Lab Builder: build hands-on labs in Cisco Modeling Labs 2.9 and grade them (CCNP ENCOR track included)"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dylan Vaughan (Specops13)"}]
requires-python = ">=3.10,<3.14"
dependencies = [
  "virl2_client>=2.9.0,<2.10",   # must match CML controller 2.9.x
  "pydantic>=2.6,<3",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "paramiko>=3.4",
  "keyring>=24",
]

[project.optional-dependencies]
pyats = ["virl2_client[pyats]>=2.9.0,<2.10"]   # Linux/macOS only (pyATS has no native Windows support)
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
cmllab = "encorlab.cli:app"                # 2.1.0: the CLI's new name
cml-lab-builder = "encorlab.launcher:main"
encorlab = "encorlab.cli:app"              # old names, kept as aliases
encorlab-app = "encorlab.launcher:main"

[tool.setuptools]
py-modules = ["encorboot"]   # boot loader of the packaged app (part of the frozen runtime, not of app patches)

[tool.setuptools.packages.find]
include = ["encorlab*"]

[tool.setuptools.package-data]
encorlab = ["web/templates/*.html", "web/static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
