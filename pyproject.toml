[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encorlab"
version = "1.8.0"
description = "Build CCNP ENCOR (350-401) practice labs in Cisco Modeling Labs 2.9 and grade them"
requires-python = ">=3.10,<3.14"
dependencies = [
  "virl2_client>=2.9.0,<2.10",   # must match CML controller 2.9.x
  "pydantic>=2.6,<3",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "paramiko>=3.4",
  "keyring>=24",
]

[project.optional-dependencies]
pyats = ["virl2_client[pyats]>=2.9.0,<2.10"]   # Linux/macOS only (pyATS has no native Windows support)
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
encorlab = "encorlab.cli:app"
encorlab-app = "encorlab.launcher:main"

[tool.setuptools]
py-modules = ["encorboot"]   # boot loader of the packaged app (part of the frozen runtime, not of app patches)

[tool.setuptools.packages.find]
include = ["encorlab*"]

[tool.setuptools.package-data]
encorlab = ["labs/*/*.yaml", "labs/*/*.cfg", "web/templates/*.html", "web/static/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
